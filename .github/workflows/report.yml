name: 신고 알림
on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 새 신고 확인
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-package-lock web-push@3.6.7
      - run: node .github/nori/report.mjs
        env:
          NORI_PUSH: ${{ secrets.NORI_PUSH }}
