name: Integrate reviewed UI assets
on:
  push:
    branches: [ux/accessibility-consistency-review]
    paths: [ux-review.css, ux-review.js, .github/workflows/ui-review-integration.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/ux/accessibility-consistency-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach reviewed assets and refresh offline shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          p = Path('index.html'); s = p.read_text()
          s = s.replace('<body><title>노리보카</title>', '<body>')
          if '<title>' not in s:
              s = s.replace('</head>', '<title>노리보카</title></head>', 1)
          s = s.replace('<link rel="stylesheet" href="ux-review.css">', '')
          pos = s.rfind('</style>') + len('</style>')
          s = s[:pos] + '\n<link rel="stylesheet" href="ux-review.css">\n' + s[pos:]
          if 'src="ux-review.js"' not in s:
              s = s.replace('</body>', '<script src="ux-review.js"></script></body>')
          assert s.count('href="ux-review.css"') == 1
          assert s.count('src="ux-review.js"') == 1
          assert s.index('href="ux-review.css"') > s.rfind('</style>')
          p.write_text(s)
          digest = hashlib.sha256(Path('ux-review.css').read_bytes() + Path('ux-review.js').read_bytes()).hexdigest()[:12]
          p = Path('sw.js'); s = p.read_text()
          s = re.sub(r"const CACHE = '[^']+';", "const CACHE = 'norivoka-ux-" + digest + "';", s, count=1)
          if "'./ux-review.css'" not in s:
              s = s.replace("const CORE = [", "const CORE = ['./ux-review.css', './ux-review.js', ", 1)
          p.write_text(s)
          css = Path('ux-review.css').read_text()
          js = Path('ux-review.js').read_text()
          assert '#lg-note{display:none!important}' in css
          assert 'lg-note lg-err' not in js
          PY
          node --check ux-review.js
          node --check sw.js
      - name: Commit integration on review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Integrate reviewed assets and refresh content-versioned offline cache'
          git push origin HEAD:ux/accessibility-consistency-review
