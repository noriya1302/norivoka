name: 노리 알림
on:
  schedule:
    - cron: '7 11 * * *'   # 매일 20:07 (한국 시간)
  workflow_dispatch:
    inputs:
      mode:
        description: 'test 로 두면 알림을 켠 모든 사람에게 테스트 알림을 보내요'
        required: false
        default: 'daily'
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-package-lock web-push@3.6.7
      - run: node .github/nori/push.mjs
        env:
          NORI_PUSH: ${{ secrets.NORI_PUSH }}
          MODE: ${{ github.event.inputs.mode || 'daily' }}
